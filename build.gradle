plugins {
    id "idea"
    id "org.jetbrains.kotlin.jvm" version "2.0.0"
    id "com.google.protobuf" version "0.9.4"
    id "com.gradleup.shadow" version "8.3.7"
    id "java-library"
}

def versions = [
    kotlin: "2.0.0",
    coroutines: "1.8.1",
    grpc: "1.63.0",
    grpcKotlin: "1.4.1",
    protobuf: "4.26.1",
    annotations: "1.3.2",
    mc: "1.21.1"
]

ext {
    projectName = "mcpq"
    majorVersion = "2"
    minorVersion = "3"
}

version "${majorVersion}.${minorVersion}"
group "com.github.mcpq"

repositories {
    mavenCentral()
    maven {
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
}

// Java configuration
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${versions.mc}-R0.1-SNAPSHOT"
    // fix compile java alla https://github.com/grpc/grpc-java/issues/4725
    compileOnly "javax.annotation:javax.annotation-api:${versions.annotations}" // Needed for gRPC Java
    
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${versions.coroutines}"
    implementation "com.google.protobuf:protobuf-java:${versions.protobuf}"
    implementation "com.google.protobuf:protobuf-kotlin:${versions.protobuf}"
    implementation "io.grpc:grpc-netty-shaded:${versions.grpc}"
    implementation("io.grpc:grpc-protobuf:${versions.grpc}") {
        exclude group: "com.google.protobuf", module: "protobuf-java"
    }
    implementation "io.grpc:grpc-stub:${versions.grpc}"
    implementation "io.grpc:grpc-kotlin-stub:${versions.grpcKotlin}"
}

dependencies.constraints {
    implementation("com.google.protobuf:protobuf-java") {
        version { strictly versions.protobuf }
        because("Must match protoc version for codegen compatibility")
    }
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${versions.protobuf}" }
    plugins {
        grpc { artifact = "io.grpc:protoc-gen-grpc-java:${versions.grpc}" }
        grpckt { artifact = "io.grpc:protoc-gen-grpc-kotlin:${versions.grpcKotlin}:jdk8@jar" }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins { grpc { }; grpckt { } }
        }
    }
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        freeCompilerArgs.addAll("-Xjsr305=strict")
    }
}

tasks.jar.configure {
    enabled = false
}

processResources {
    filesMatching('**/plugin.yml') {
        expand(version: version)
    }
}

shadowJar {
    archiveClassifier.set("")
    outputs.upToDateWhen { false }
    
    relocate "com.google.protobuf", "shadow.com.google.protobuf"
    relocate "io.grpc", "shadow.io.grpc"
    relocate "kotlinx.coroutines", "shadow.kotlinx.coroutines"
    
    mergeServiceFiles()
}

tasks.build.dependsOn(shadowJar)